version: "1.0.0"

scoring_rules:
  core_na_with_reason: false
  note: "idea rubric：headline 是「推进就绪度」，只由 core 项计算；why 和 maturity 是诊断维度，不进入 headline。"

dimensions:
  - id: claim
    name: 一句话可转述
    weight: 2
    items:
      - id: claim.standalone
        question: "不看正文，这一句话能不能独立讲清想法是什么？"
        tier: core
        weight: 2
        section: "一句话描述"
        aliases: ["一句话描述", "一句话", "描述"]
        na_allowed: false
        levels:
          "0": "缺失，或只是复述标题"
          "1": "能理解，但需要正文才能说清"
          "2": "不看正文也能独立讲清，且不是标题的复述"
        evidence_hint: "一句话描述本身；如果它只换了标题的词，判 0"

      - id: claim.specific
        question: "这句话有没有具体对象、场景或机制？"
        tier: extended
        weight: 1
        section: "一句话描述"
        aliases: ["一句话描述", "一句话", "描述"]
        na_allowed: true
        levels:
          "0": "只有抽象名词，没有对象或场景"
          "1": "有一个具体词，但整体仍泛"
          "2": "有具体对象、场景或机制，能被转述"
        evidence_hint: "具体的人、场景、数据或机制"

  - id: problem
    name: 问题具体性
    weight: 2
    items:
      - id: problem.trigger
        question: "有没有一个真实的触发场景，让这个问题出现？"
        tier: core
        weight: 2
        section: "为什么有意思"
        aliases: ["为什么有意思", "为什么", "问题"]
        na_allowed: false
        levels:
          "0": "没有真实触发场景"
          "1": "有场景描述，但泛泛"
          "2": "有具体触发场景、受影响对象或证据"
        evidence_hint: "什么时候、在哪里、因为什么发生"

      - id: problem.affected
        question: "有没有写清谁或什么系统被卡住？"
        tier: extended
        weight: 1
        section: "为什么有意思"
        aliases: ["为什么有意思", "为什么", "问题"]
        na_allowed: true
        levels:
          "0": "没写谁受影响"
          "1": "写了角色或系统，但不具体"
          "2": "写了具体的人、角色或下游系统"
        evidence_hint: "具体角色或系统，不要写「用户」"

  - id: advance
    name: 推进就绪度
    weight: 4
    items:
      - id: next.testable
        question: "下一步是不是一个最小动作，并且有可观察结果和证伪条件？"
        tier: core
        weight: 3
        section: "下一步"
        aliases: ["下一步", "下一步计划"]
        na_allowed: false
        levels:
          "0": "缺失，或只有「继续调研 / 再看看」"
          "1": "有动作，但没有可观察结果或证伪条件"
          "2": "有一个最小动作 + 可观察结果 + 能证伪核心假设"
        evidence_hint: "动作、观察到的结果、什么情况下算失败"

      - id: next.bounded
        question: "这个下一步有没有范围或时间边界？"
        tier: core
        weight: 1
        section: "下一步"
        aliases: ["下一步", "下一步计划"]
        na_allowed: false
        levels:
          "0": "没有范围或时间边界"
          "1": "有模糊边界（尽快 / 有空）"
          "2": "有明确范围或时间（≤1 天 / ≤1 周）"
        evidence_hint: "时间盒、样本量或范围上限"

      - id: next.kill
        question: "有没有明确的停止条件？"
        tier: extended
        weight: 1
        section: "下一步"
        aliases: ["下一步", "下一步计划"]
        na_allowed: true
        levels:
          "0": "没有停止条件"
          "1": "有「不行就停」但没有判据"
          "2": "有明确的 kill criterion（看到什么就停）"
        evidence_hint: "可观察的停止判据"

  - id: why
    name: 非显而易见
    weight: 1
    items:
      - id: why.nonobvious
        question: "它和常识、已有方案或库里其他想法有什么区别？"
        tier: extended
        weight: 1
        section: "为什么有意思"
        aliases: ["为什么有意思", "为什么"]
        na_allowed: false
        levels:
          "0": "是常识或已有方案的复述"
          "1": "有一点新意，但说不出和已有方案的区别"
          "2": "能说清与常识、已有想法或已有方案的区别"
        evidence_hint: "被替代的方案，以及它为什么不够"

  - id: maturity
    name: 成熟度
    weight: 1
    items:
      - id: maturity.stage
        question: "这个想法现在处于早期、成形还是可推进？"
        tier: extended
        weight: 1
        section: "全文"
        aliases: ["全文"]
        na_allowed: false
        levels:
          "0": "早期：只有一句话，机制和场景都未成形"
          "1": "成形：机制和场景至少一个已说清"
          "2": "可推进：机制、场景、下一步都足以判断"
        evidence_hint: "机制、场景和下一步的完成度"

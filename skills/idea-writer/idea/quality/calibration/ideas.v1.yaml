version: "1.0.0"
rubric_version: "1.0.0"
description: >
  Human triage labels for the five ideas in ~/Workspace/ideas as of 2026-11-02.
  The reviewer must not see this file. Triage is the human decision the
  headline is calibrated against: 推进 = try the next step now, 观察 = keep it
  but do not advance yet, 搁置 = stop for now. One idea is held out; tune the
  rubric on the other four, then score the held-out idea once.

comparison:
  metric: "advance vs not-advance"
  positive: ["推进"]
  negative: ["观察", "搁置"]
  rule: >
    The headline is 推进就绪度, so compare binary decisions: headline >= 70
    counts as 推进; below 70 counts as 不推进 (观察 and 搁置 both mean "do not
    advance now"). Agreement requires at least 3 of the 5 labels to match;
    report the held-out idea separately. The three headline bands remain for
    reporting, not for this agreement check.

labels:
  - id: SCCIZBQQ
    title: 万花筒
    path: 2026/2026-11-01/万花筒.md
    triage: 观察
    maturity: 成形
    held_out: false
    note: 想法清楚，但「下一步」是暂无；适合观察，不适合现在推进。

  - id: JHVDDWAH
    title: 情景式英语学习

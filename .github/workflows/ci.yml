name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: build
        run: go build -o mdstandards .

      - name: self-check
        run: ./mdstandards -root . -policy ./policy -phase 1 -format github

      - name: idea corpus smoke
        run: ./mdstandards -root ./testdata/idea-repo -policy ./policy -phase 1 -format github

      - name: mixed corpus smoke
        run: ./mdstandards -root ./testdata/mixed-repo -policy ./policy -phase 1 -format github

      - name: build taskscheck
        run: go build -o taskscheck ./tools/taskscheck

      - name: taskscheck
        run: ./taskscheck -root . -phase 1 -format github

      - name: validate plugin manifests
        run: |
          npm i -g @anthropic-ai/claude-code@2.1.292
          claude plugin validate .

      - name: shim behavior tests
        run: sh scripts/shim-test.sh
